* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--vd-bg);
  color: var(--vd-text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 14px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header.vd-header {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 16px;
  border-bottom: 1px solid var(--vd-border);
  background: var(--vd-surface);
  position: sticky;
  top: 0;
  z-index: 10;
}
.vd-title {
  font-size: 15px;
  font-weight: 650;
  margin: 0;
  letter-spacing: 0.01em;
}
.vd-controls {
  display: flex;
  gap: 8px;
  margin-left: auto;
  align-items: center;
}
.vd-controls input[type="search"] {
  background: var(--vd-bg);
  color: var(--vd-text);
  border: 1px solid var(--vd-border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 13px;
  width: 180px;
}
.vd-controls input[type="search"]:focus {
  outline: 2px solid var(--vd-accent);
  outline-offset: 1px;
}
.vd-controls button {
  background: var(--vd-surface);
  color: var(--vd-text);
  border: 1px solid var(--vd-border);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
}
.vd-controls button:hover { border-color: var(--vd-accent); color: var(--vd-accent); }
.vd-controls button:focus-visible { outline: 2px solid var(--vd-accent); outline-offset: 1px; }
.vd-controls button:active { transform: translateY(1px); }

main.vd-stage {
  flex: 1;
  overflow: hidden;
  cursor: grab;
  touch-action: pinch-zoom;
}
main.vd-stage.vd-panning { cursor: grabbing; }
main.vd-stage:focus-visible { outline: 2px solid var(--vd-accent); outline-offset: -2px; }
.vd-search-status { font-size: 12px; color: var(--vd-text-dim); min-width: 4em; }
.vd-zoom { display: inline-flex; gap: 2px; }
.vd-zoom button { min-width: 2em; font-weight: 600; }
.vd-svg {
  width: 100%;
  height: calc(100vh - 54px);
  display: block;
}

.vd-node-box {
  fill: var(--vd-surface);
  stroke-width: 1.5;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.12));
}
.vd-t-frontend .vd-node-box, .vd-legend-swatch.vd-t-frontend { fill: var(--vd-t-frontend); stroke: var(--vd-t-frontend-line); }
.vd-t-backend .vd-node-box, .vd-legend-swatch.vd-t-backend { fill: var(--vd-t-backend); stroke: var(--vd-t-backend-line); }
.vd-t-database .vd-node-box, .vd-legend-swatch.vd-t-database { fill: var(--vd-t-database); stroke: var(--vd-t-database-line); }
.vd-t-cloud .vd-node-box, .vd-legend-swatch.vd-t-cloud { fill: var(--vd-t-cloud); stroke: var(--vd-t-cloud-line); }
.vd-t-security .vd-node-box, .vd-legend-swatch.vd-t-security { fill: var(--vd-t-security); stroke: var(--vd-t-security-line); }
.vd-t-messagebus .vd-node-box, .vd-legend-swatch.vd-t-messagebus { fill: var(--vd-t-messagebus); stroke: var(--vd-t-messagebus-line); }
.vd-t-external .vd-node-box, .vd-legend-swatch.vd-t-external { fill: var(--vd-t-external); stroke: var(--vd-t-external-line); stroke-dasharray: 4 3; }

.vd-node-label { fill: var(--vd-text); font-weight: 600; }
.vd-node-sub { fill: var(--vd-text-dim); font-family: var(--vd-mono); }
.vd-node-tag-pill { fill: var(--vd-highlight); stroke: none; }
.vd-node-tag { fill: var(--vd-text); font-weight: 600; }

.vd-node-glyph-bg { fill: var(--vd-surface); stroke-width: 1.5; }
.vd-node-glyph { fill: var(--vd-text); font-weight: 700; font-family: var(--vd-mono); }
.vd-t-frontend .vd-node-glyph-bg { stroke: var(--vd-t-frontend-line); }
.vd-t-backend .vd-node-glyph-bg { stroke: var(--vd-t-backend-line); }
.vd-t-database .vd-node-glyph-bg { stroke: var(--vd-t-database-line); }
.vd-t-cloud .vd-node-glyph-bg { stroke: var(--vd-t-cloud-line); }
.vd-t-security .vd-node-glyph-bg { stroke: var(--vd-t-security-line); }
.vd-t-messagebus .vd-node-glyph-bg { stroke: var(--vd-t-messagebus-line); }
.vd-t-external .vd-node-glyph-bg { stroke: var(--vd-t-external-line); }
.vd-t-database .vd-node-box { stroke-width: 2.4; }
.vd-legend-glyph { fill: var(--vd-text); font-weight: 700; font-family: var(--vd-mono); }

.vd-node.vd-dim { opacity: 0.22; }
.vd-node.vd-hit .vd-node-box { stroke: var(--vd-accent); stroke-width: 3; }
.vd-edge-group.vd-dim { opacity: 0.15; }
.vd-edge-group.vd-hit .vd-edge { stroke-width: 3; }
.vd-boundary.vd-dim { opacity: 0.3; }

.vd-edge { fill: none; stroke: var(--vd-edge); stroke-width: 1.6; }
.vd-edge.vd-v-emphasis { stroke: var(--vd-edge-emphasis); stroke-width: 2.4; }
.vd-edge.vd-v-security { stroke: var(--vd-edge-security); stroke-width: 1.8; }
.vd-edge.vd-v-dashed { stroke-dasharray: 6 4; }
.vd-arrowhead { fill: var(--vd-edge); stroke: none; }
.vd-arrowhead.vd-v-emphasis { fill: var(--vd-edge-emphasis); }
.vd-arrowhead.vd-v-security { fill: var(--vd-edge-security); }
.vd-edge-label-mask { fill: var(--vd-bg); stroke: var(--vd-border); stroke-width: 0.5; }
.vd-edge-label { fill: var(--vd-text-dim); font-family: var(--vd-mono); }

.vd-boundary rect { fill: none; stroke: var(--vd-boundary); stroke-width: 1.2; stroke-dasharray: 8 5; }
.vd-boundary-label { fill: var(--vd-boundary); font-weight: 600; letter-spacing: 0.04em; }

.vd-legend-label { fill: var(--vd-text-dim); }
.vd-legend-swatch { stroke-width: 1.2; }
.vd-legend-line { stroke: var(--vd-edge); stroke-width: 2; }
.vd-legend-line.vd-v-emphasis { stroke: var(--vd-edge-emphasis); }
.vd-legend-line.vd-v-security { stroke: var(--vd-edge-security); }
.vd-legend-line.vd-v-dashed { stroke-dasharray: 5 3; }

section.vd-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
  padding: 16px;
  border-top: 1px solid var(--vd-border);
  background: var(--vd-surface);
}
.vd-cards h2 {
  grid-column: 1 / -1;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--vd-text-dim);
  margin: 0;
}
.vd-cards article {
  background: var(--vd-bg);
  border: 1px solid var(--vd-border);
  border-radius: 10px;
  padding: 12px 14px;
}
.vd-cards h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  margin: 0 0 8px;
}
.vd-cards ul { margin: 0; padding-left: 18px; color: var(--vd-text-dim); font-size: 13px; }
.vd-cards li { margin: 3px 0; }
.vd-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.vd-dot-cyan { background: oklch(70% 0.12 210); }
.vd-dot-blue { background: oklch(62% 0.16 255); }
.vd-dot-green { background: oklch(65% 0.15 150); }
.vd-dot-amber { background: oklch(75% 0.14 80); }
.vd-dot-red { background: oklch(62% 0.18 25); }
.vd-dot-purple { background: oklch(62% 0.16 310); }
.vd-dot-gray { background: oklch(60% 0.01 255); }

@media (max-width: 640px) {
  .vd-controls input[type="search"] { width: 120px; }
  .vd-svg { height: calc(100vh - 96px); }
}
</style>
</head>

<script>/* veduta viewer — 完全オフラインで動作する最小ビューア。
 * 禁止事項 (CI で grep 検証): DOM 文字列注入 API・動的コード実行・location への代入。
 * DOM 構築は createElement + textContent のみ。 */
(function () {
  "use strict";

  var svg = document.querySelector(".vd-svg");
  if (!svg) { return; }

  /* ---- 埋め込み IR データ (application/json はスクリプトとして実行されない) ---- */
  var data = null;
  try {
    var dataEl = document.getElementById("vd-data");
    if (dataEl) { data = JSON.parse(dataEl.textContent); }
  } catch (e) { data = null; }

  var knownIds = Object.create(null);
  if (data && Array.isArray(data.components)) {
    for (var i = 0; i < data.components.length; i++) {
      var c = data.components[i];
      if (c && typeof c.id === "string") { knownIds[c.id] = true; }
    }
  }

  /* nodeEdges[nodeId] = [edgeId...] : 検索時に接続辺を強調するための対応表 */
  var nodeEdges = Object.create(null);
  if (data && Array.isArray(data.connections)) {
    for (var j = 0; j < data.connections.length; j++) {
      var cn = data.connections[j];
      if (!cn || typeof cn.id !== "string") { continue; }
      (nodeEdges[cn.from] = nodeEdges[cn.from] || []).push(cn.id);
      (nodeEdges[cn.to] = nodeEdges[cn.to] || []).push(cn.id);
    }
  }

  /* ---- pan / zoom: viewBox を直接操作する ---- */
  var vb0 = (svg.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(Number);
  var vb = vb0.slice();
  function applyViewBox() { svg.setAttribute("viewBox", vb.join(" ")); }

  var stage = document.querySelector(".vd-stage") || svg;

  function unitsPerPixel() {
    var r = svg.getBoundingClientRect();
    return r.width > 0 ? vb[2] / r.width : 1;
  }
  function pointerRatio(clientX, clientY) {
    var r = svg.getBoundingClientRect();
    return {
      x: r.width > 0 ? (clientX - r.left) / r.width : 0.5,
      y: r.height > 0 ? (clientY - r.top) / r.height : 0.5
    };
  }
  function zoomBy(factor, px, py) {
    var nw = vb[2] * factor, nh = vb[3] * factor;
    if (nw < vb0[2] / 50 || nw > vb0[2] * 50) { return; }
    vb[0] += (vb[2] - nw) * px;
    vb[1] += (vb[3] - nh) * py;
    vb[2] = nw; vb[3] = nh;
    applyViewBox();
  }
  function resetView() { vb = vb0.slice(); applyViewBox(); }

  /* --- ポインタ: 1本なら pan、2本なら pinch zoom --- */
  var pointers = Object.create(null);
  var pointerCount = 0, lastX = 0, lastY = 0, pinchDist = 0;

  stage.addEventListener("pointerdown", function (ev) {
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    pointerCount++;
    if (pointerCount === 1) { lastX = ev.clientX; lastY = ev.clientY; stage.classList.add("vd-panning"); }
    if (stage.setPointerCapture) { try { stage.setPointerCapture(ev.pointerId); } catch (e) { /* noop */ } }
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!pointers[ev.pointerId]) { return; }
    pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    var ids = Object.keys(pointers);
    if (ids.length >= 2) {
      var a = pointers[ids[0]], b = pointers[ids[1]];
      var dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0 && dist > 0) {
        var mid = pointerRatio((a.x + b.x) / 2, (a.y + b.y) / 2);
        zoomBy(pinchDist / dist, mid.x, mid.y);
      }
      pinchDist = dist;
      return;
    }
    var k = unitsPerPixel();
    vb[0] -= (ev.clientX - lastX) * k;
    vb[1] -= (ev.clientY - lastY) * k;
    lastX = ev.clientX; lastY = ev.clientY;
    applyViewBox();
  });
  function endPointer(ev) {
    if (pointers[ev.pointerId]) { delete pointers[ev.pointerId]; pointerCount = Math.max(0, pointerCount - 1); }
    if (pointerCount < 2) { pinchDist = 0; }
    if (pointerCount === 0) { stage.classList.remove("vd-panning"); }
  }
  stage.addEventListener("pointerup", endPointer);
  stage.addEventListener("pointercancel", endPointer);

  /* wheel: 修飾キー (Ctrl/Cmd) 付きのみ zoom。通常 wheel はページスクロールに委ねる。 */
  stage.addEventListener("wheel", function (ev) {
    if (!ev.ctrlKey && !ev.metaKey) { return; }
    ev.preventDefault();
    var p = pointerRatio(ev.clientX, ev.clientY);
    zoomBy(ev.deltaY > 0 ? 1.12 : 1 / 1.12, p.x, p.y);
  }, { passive: false });

  /* キーボード: 矢印で pan、+/- で zoom、0/Home でリセット */
  stage.addEventListener("keydown", function (ev) {
    var step = vb[2] * 0.08;
    switch (ev.key) {
      case "ArrowLeft": vb[0] -= step; break;
      case "ArrowRight": vb[0] += step; break;
      case "ArrowUp": vb[1] -= step; break;
      case "ArrowDown": vb[1] += step; break;
      case "+": case "=": zoomBy(1 / 1.2, 0.5, 0.5); ev.preventDefault(); return;
      case "-": case "_": zoomBy(1.2, 0.5, 0.5); ev.preventDefault(); return;
      case "0": case "Home": resetView(); ev.preventDefault(); return;
      default: return;
    }
    applyViewBox();
    ev.preventDefault();
  });

  function bindClick(id, fn) {
    var el = document.getElementById(id);
    if (el) { el.addEventListener("click", fn); }
  }
  bindClick("vd-reset", resetView);
  bindClick("vd-zoom-in", function () { zoomBy(1 / 1.2, 0.5, 0.5); });
  bindClick("vd-zoom-out", function () { zoomBy(1.2, 0.5, 0.5); });

  /* ---- テーマ切替 ---- */
  var themeBtn = document.getElementById("vd-theme");
  function currentTheme() { return document.documentElement.getAttribute("data-theme") || ""; }
  function effectiveDark() {
    var cur = currentTheme();
    if (cur === "dark") { return true; }
    if (cur === "light") { return false; }
    try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; }
  }
  function syncThemePressed() {
    if (themeBtn) { themeBtn.setAttribute("aria-pressed", effectiveDark() ? "true" : "false"); }
  }
  function setTheme(t) {
    if (t === "dark" || t === "light") { document.documentElement.setAttribute("data-theme", t); }
    else { document.documentElement.removeAttribute("data-theme"); }
    syncThemePressed();
    try { localStorage.setItem("vd-theme", t); } catch (e) { /* 保存不可でも継続 */ }
  }
  if (themeBtn) {
    themeBtn.addEventListener("click", function () { setTheme(effectiveDark() ? "light" : "dark"); });
  }
  try {
    var saved = localStorage.getItem("vd-theme");
    if (saved === "dark" || saved === "light") { setTheme(saved); }
  } catch (e) { /* noop */ }
  syncThemePressed();

  /* ---- ノード検索 (接続辺・関連境界も強調) ---- */
  var nodes = document.querySelectorAll(".vd-node");
  var edgeGroups = document.querySelectorAll(".vd-edge-group");
  var boundaries = document.querySelectorAll(".vd-boundary");
  var status = document.getElementById("vd-search-status");

  function nodeId(el) { return (el.id || "").replace(/^vd-node-/, ""); }
  function edgeId(el) { return (el.id || "").replace(/^vd-edge-/, ""); }
  function unmark(el) { el.classList.remove("vd-dim"); el.classList.remove("vd-hit"); }

  function clearMarks() {
    var k;
    for (k = 0; k < nodes.length; k++) { unmark(nodes[k]); }
    for (k = 0; k < edgeGroups.length; k++) { unmark(edgeGroups[k]); }
    for (k = 0; k < boundaries.length; k++) { unmark(boundaries[k]); }
    if (status) { status.textContent = ""; }
  }

  function runSearch(q) {
    q = q.trim().toLowerCase();
    if (q === "") { clearMarks(); return; }
    var hitNodes = Object.create(null), hitCount = 0, i;
    for (i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var label = (el.getAttribute("data-label") || "").toLowerCase();
      var id = nodeId(el).toLowerCase();
      if (label.indexOf(q) >= 0 || id.indexOf(q) >= 0) {
        el.classList.add("vd-hit"); el.classList.remove("vd-dim");
        hitNodes[nodeId(el)] = true; hitCount++;
      } else {
        el.classList.add("vd-dim"); el.classList.remove("vd-hit");
      }
    }
    var hitEdges = Object.create(null), id2;
    for (id2 in hitNodes) {
      var es = nodeEdges[id2];
      if (es) { for (var m = 0; m < es.length; m++) { hitEdges[es[m]] = true; } }
    }
    for (i = 0; i < edgeGroups.length; i++) {
      var eg = edgeGroups[i];
      if (hitEdges[edgeId(eg)]) { eg.classList.add("vd-hit"); eg.classList.remove("vd-dim"); }
      else { eg.classList.add("vd-dim"); eg.classList.remove("vd-hit"); }
    }
    for (i = 0; i < boundaries.length; i++) { boundaries[i].classList.add("vd-dim"); boundaries[i].classList.remove("vd-hit"); }
    if (status) { status.textContent = hitCount + " / " + nodes.length; }
  }

  var searchEl = document.getElementById("vd-search");
  if (searchEl) { searchEl.addEventListener("input", function () { runSearch(searchEl.value); }); }

  /* ---- ディープリンク (#focus=node-id) ----
   * location.hash は攻撃者が制御できる。許可文字にマッチさせ、
   * 既知のノード ID と照合してから使う。マッチしなければ黙って無視する。 */
  function applyHashFocus() {
    var mt = /^#focus=([A-Za-z0-9][A-Za-z0-9_-]{0,63})$/.exec(location.hash || "");
    if (!mt || !knownIds[mt[1]]) { return; }
    if (searchEl) { searchEl.value = mt[1]; }
    runSearch(mt[1]);
  }
  window.addEventListener("hashchange", applyHashFocus);
  applyHashFocus();
})();
</script>
